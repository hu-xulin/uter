<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the theme class before first paint to avoid a flash.
      //
      // The authoritative theme is the `newapi:theme:v1:mode` localStorage
      // entry (see src/lib/theme-storage.ts and context/theme-provider.tsx).
      // Read it directly so the first paint matches what the app resolves
      // to, then fall back to dark. The `vite-ui-theme` cookie is a legacy
      // leftover the SPA never writes, so keying the pre-paint off it pinned
      // every load to dark until React re-applied the stored theme.
      ;(function () {
        try {
          var t = null
          try {
            t = window.localStorage.getItem('newapi:theme:v1:mode')
          } catch (e) {}
          if (t !== 'dark' && t !== 'light' && t !== 'system') t = 'dark'
          var d =
            t === 'dark' ||
            (t === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.remove('light', 'dark')
          document.documentElement.classList.add(d ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <!-- Bump the `?v=` below together with LOGO_ASSET_VERSION in
         `src/lib/constants.ts` whenever `public/logo.png` is replaced.
         The version is what evicts an already-cached copy in the browser.

         Keep this the ONLY icon declaration. Rsbuild auto-detects
         `public/favicon.{ico,png,svg}` and injects an un-versioned
         `<link rel="icon" href="/favicon.ico">` ahead of everything here.
         That extra URL cannot be cache-busted, so a browser that captured
         the old bitmap for it keeps showing the stale tab icon after a
         logo swap — the file is therefore shipped as
         `public/favicon-legacy.ico` (still fetchable at
         `/favicon-legacy.ico`) and deliberately not named `favicon.ico`. -->
    <link rel="icon" type="image/png" sizes="any" href="/logo.png?v=8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png?v=8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <!-- Reset links carry email+token in the query string. strict-origin-when-cross-origin
         keeps the full path/query out of cross-origin Referer headers, so the
         credential cannot leak to third-party origins the user navigates to. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Primary Meta Tags -->
    <title>Uter</title>
    <meta name="title" content="Uter" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#020617" />
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
