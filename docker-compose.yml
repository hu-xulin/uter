# Uter 生产部署 - Docker Compose 配置（PostgreSQL 版，密钥经 .env 注入）
#
# 快速开始：
#   1. 复制模板：cp .env.example .env
#   2. 编辑 .env，填入强随机密码（见下方“密钥生成”）
#   3. 启动：docker compose up -d
#   4. 经由前置 TLS 反向代理访问 https://<你的域名>（应用容器本身不终止 TLS）
#
# ⚠️ 安全要点（部署前必读）：
#   - 本文件不含任何明文密码，全部经 ${...} 从同目录 .env 注入；
#     .env 已被 .gitignore 忽略，不会提交到公开仓库（uter-ai/uter）。
#   - 切勿把真实密码写回本文件或提交到仓库。
#   - 端口暴露面已最小化：仅应用 3000 对外；PostgreSQL / Redis 仅在内部网络互通，无 published 端口。
#   - SESSION_COOKIE_SECURE=true 要求全站 HTTPS。请在宿主机前置 nginx / Caddy / Traefik 做 TLS 终止，
#     应用端口默认绑定 127.0.0.1:3000:3000，避免明文直曝。
#
# 密钥生成（在宿主机执行）：
#   openssl rand -hex 24         # PG_PASSWORD / REDIS_PASSWORD (URL-safe)
#   openssl rand -hex 48         # SESSION_SECRET

services:
  uter:
    # 镜像：默认使用本地构建的 uter:latest；或设置 UTER_IMAGE 指向你的镜像仓库
    # （如 ghcr.io/uter-ai/uter:latest）。本地构建：先 `docker build -t uter .`，或取消下一行注释并注释掉 image 行
    # build: .
    image: ${UTER_IMAGE:-uter:latest}
    container_name: uter
    restart: always
    command: --log-dir /app/logs
    # 默认仅绑定回环地址，要求通过同机 TLS 反向代理访问，避免明文 HTTP 直接暴露。
    # 如确需直接对外暴露，请显式覆盖并自行确保 TLS 与访问控制。
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      # 主数据库（PostgreSQL），凭据来自 .env
      - SQL_DSN=postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DATABASE}
      # 可选：独立日志库；留空则复用主库。也可指向 ClickHouse（见底部注释）
      # - LOG_SQL_DSN=postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DATABASE}_log
      # Redis（缓存 / 会话 / 速率限制）
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD}@redis:6379
      - TZ=${TZ:-Asia/Shanghai}
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=uter-node-1
      # 多实例部署必须设置 SESSION_SECRET；单实例也建议设置（来自 .env）
      - SESSION_SECRET=${SESSION_SECRET}
      # 生产用 HTTPS：true。若为本地裸 HTTP 测试可临时设为 false
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      # SESSION_COOKIE_SECURE=true 时必填，精确 HTTPS Origin（英文逗号分隔，不支持通配符/路径）
      - SESSION_COOKIE_TRUSTED_URL=${SESSION_COOKIE_TRUSTED_URL}
      # Exact comma-separated browser origins allowed to make cross-origin API requests.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # 可信反向代理网段；留空=信任回环/RFC1918 并告警，none 为严格模式
      # - TRUSTED_PROXIES=172.20.0.0/16
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - uter-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    container_name: redis
    restart: always
    # 启用密码认证（必填，来自 .env）；无 published 端口，仅内部网络可达
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - uter-network

  postgres:
    image: postgres:15@sha256:c961aa287d8698297cb26cdfadfbe9fd2cbaf77e53cfffe9636e8d8a1e4d842c
    container_name: postgres
    restart: always
    # 仅在内部网络创建，无 published 端口：数据库不对外暴露，仅 uter 经内部网络访问
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - uter-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:

networks:
  uter-network:
    driver: bridge
