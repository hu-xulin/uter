# MAIN-ONLY BRANCH POLICY — owner instruction 2026-11-11
# ---------------------------------------------------------------------------
# Owner directive: "将 uter 所有分支合并，只保留 main，没有我的指令，严禁再自动
# 生成新分支". Owner selected the option "本地清理 + 停用自动建分支".
#
# Dependabot creates a branch in this repository for EVERY update PR it opens.
# `open-pull-requests-limit: 0` therefore disables version-update PRs — and
# with them the automatic creation of non-main branches — for every ecosystem.
# This is a deliberate, owner-authorised policy change, NOT an accidental
# regression of the previous "limit: 10" setting.
#
# KNOWN CONSEQUENCE (recorded, not hidden):
#   * Automatic dependency version upgrades stop. Security-relevant upgrades
#     must now be tracked manually through the weekly security audit workflow
#     and the govulncheck / gitleaks gates in ci.yml.
#   * GitHub's repo-level "Dependabot security updates" setting can still open
#     PRs (and hence branches) on its own. That setting is NOT controlled by
#     this file; it is tracked as PENDING_APPROVAL in
#     reports/final/UTER-BRANCH-POLICY-VALIDATION.json.
#
# Enforcement layers:
#   1. This file stops Dependabot version-update branches.
#   2. .githooks/reference-transaction (git config core.hooksPath .githooks)
#      refuses creation of ANY local branch other than main, including by AI
#      agents running `git branch` / `git checkout -b`.
#   3. quality/scripts/aes/branch-policy-verifier.mjs (AES, canonical) is run
#      by ci.yml on every main push and fails the build on any drift.
# ---------------------------------------------------------------------------
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 0
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 0
  # Multi-module repository: every Go module needs its own entry, otherwise
  # Dependabot only scans the root module. Keep relaykit/tokenkit granular.
  - package-ecosystem: "gomod"
    directory: "/relaykit"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 0
  - package-ecosystem: "gomod"
    directory: "/tokenkit"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 0
  # tokenkit/tokenkit is a nested module outside the root module tree.
  - package-ecosystem: "gomod"
    directory: "/tokenkit/tokenkit"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 0
  # Third-party actions used by CI are a supply-chain entry point too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 0
