name: AES Governance Synchronization

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

# P0 instruction 2026-11-11: no agent or bot may push normative changes to
# main without an approved, independently re-verified change record. The old
# job had contents: write and auto-committed/pushed pin + registry updates every
# 30 minutes, which is exactly an unapproved forced specification change.
# Synchronization is now READ-ONLY: it recomputes and verifies, then FAILS on
# any normative drift so a human approval can be recorded explicitly.
permissions:
  contents: read

concurrency:
  group: aes-governance-sync-main
  cancel-in-progress: false

jobs:
  synchronize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Uter main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout AES main
        uses: actions/checkout@v7
        with:
          repository: hu-xulin/aes
          ref: main
          path: aes
          fetch-depth: 0

      - name: Set up Node and Ruby
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Recompute AES seal and synchronize Uter pin
        env:
          AES_ROOT: ${{ github.workspace }}/aes
        run: node .aes/autonomous/engine/sync.mjs

      - name: Verify exact AES pin and registry mapping
        env:
          AES_ROOT: ${{ github.workspace }}/aes
        run: node scripts/quality/aes-integration-check.mjs --aes-root "$AES_ROOT"

      - name: Execute Uter machine governance gate
        env:
          AES_ROOT: ${{ github.workspace }}/aes
        run: ruby scripts/quality/ai-native-internal-gate.rb

      - name: Fail closed on unapproved normative drift (no auto commit, no push)
        # A changed AES governed fingerprint, pin or project registry is an
        # upstream specification change. It MUST NOT be committed or pushed by
        # this job. The job reports the drift as PENDING_APPROVAL and fails;
        # an authorised local-main change with a recorded approval is required.
        run: |
          set -euo pipefail
          drift="$(git diff --name-only -- .aes/aes-pin.json .aes/uter-governance-registry.yaml)"
          if [ -n "$drift" ]; then
            echo "BLOCKED: unapproved forced specification change detected:" >&2
            echo "$drift" >&2
            echo "State: PENDING_APPROVAL. No commit, no push, no merge performed." >&2
            git diff -- .aes/aes-pin.json .aes/uter-governance-registry.yaml >&2
            exit 1
          fi
          echo "PASS: AES governed baseline is unchanged; synchronization evidence is ephemeral and is not pushed."

      - name: Upload synchronization evidence (artifact only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aes-governance-sync-evidence
          path: |
            .aes/autonomous/records/LAST-SYNC.json
            .aes/autonomous/records/DOWNSTREAM-CHECKS.jsonl
            .aes/reports/ai-native-internal-gate.json
          if-no-files-found: ignore
