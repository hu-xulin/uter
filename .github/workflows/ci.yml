name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  # only-new-issues 在 pull_request 事件下经 GitHub API 取 PR diff，需要本只读权限。
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checkout the event commit in both jobs. A PR merge ref can disappear while
# queued runs start, and a base branch can advance after the merge event.
jobs:
  # UAP 是仓库内的治理与执行平台；每次 main push / PR 都必须先证明
  # Runtime、32 个验证器与 UAP 自身测试可执行，不能只靠 nightly schedule。
  uap-governance:
    name: UAP runtime, validators and self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
            tokenkit/tokenkit/go.sum
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Install pinned gitleaks for UAP final acceptance
        if: github.event_name == 'push'
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install H5 browser and frontend dependencies
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Build real frontend release artifacts for UAP rehearsal
        working-directory: web
        run: bun run build
      - name: Refresh UDS 8.0.0 migration and acceptance evidence
        run: |
          node docs/design-system/registry/build.mjs
          node docs/design-system/registry/finalize.mjs
      - name: Publish UDS 8.0.0 failure diagnostics
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (p) => fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf8')) : null;
          const real = read('docs/design-system/audit/visual-regression.json');
          const baseline = read('docs/design-system/audit/visual-baseline-check.json');
          const gates = read('docs/design-system/audit/GATE-EVIDENCE.json');
          console.log('--- UDS8 REAL PAGE REGRESSION ---');
          if (!real) console.log('visual-regression.json missing');
          else console.log(JSON.stringify({
            verdict: real.verdict, executed: real.executed, authenticated: real.authenticated,
            failed_scenarios: (real.results || []).filter(x => !x.pass).map(x => ({
              route: x.route, theme: x.theme, checks: x.checks, error: x.error,
              consoleErrors: x.consoleErrors, httpErrors: x.httpErrors
            })),
            gradient: real.gradient, forcedColors: real.forcedColors, errors: real.errors
          }, null, 2));
          console.log('--- UDS8 VISUAL BASELINE ---');
          if (!baseline) console.log('visual-baseline-check.json missing');
          else console.log(JSON.stringify({
            verdict: baseline.verdict, reason: baseline.reason, summary: baseline.summary,
            failed_scenarios: (baseline.results || []).filter(x => x.verdict !== 'PASS')
          }, null, 2));
          console.log('--- UDS8 GATE EVIDENCE ---');
          if (!gates) console.log('GATE-EVIDENCE.json missing');
          else console.log(JSON.stringify(gates, null, 2).slice(-24000));
          NODE
      - name: Build isolated Uter backend release binary
        run: go build -o uter-bin .
      - name: Start isolated Uter server with disposable SQLite
        run: |
          mkdir -p "$RUNNER_TEMP/uap"
          rm -f .uap/reports/H5-BROWSER-MATRIX.json .uap/reports/DEPLOY-DRY-RUN.json
          (
            HOST=127.0.0.1 \
            PORT=3000 \
            SQLITE_PATH="$RUNNER_TEMP/uap/uter.db" \
            SESSION_SECRET="$(openssl rand -hex 48)" \
            UTER_I18N_DIR="$GITHUB_WORKSPACE/web/src/i18n/locales" \
            GIN_MODE=release \
            ./uter-bin > "$RUNNER_TEMP/uap/uter-server.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/uap/uter-server.pid"
          )
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/api/status -o "$RUNNER_TEMP/uap/status.json" \
              && curl --fail --silent http://127.0.0.1:3000/ -o "$RUNNER_TEMP/uap/index.html"; then
              echo "Isolated Uter API and embedded SPA ready at http://127.0.0.1:3000"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/uap/uter-server.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/uap/uter-server.log"
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/uap/uter-server.log"
          exit 1
      # Establish one immutable execution identity for every UAP report in this CI run.
      # Each CLI command is a separate Node process; without this batch lock, each
      # process can open a different execution_id and make otherwise valid evidence
      # impossible to combine. The fingerprint is still independently rechecked.
      - name: Open single UAP evidence batch
        id: uap_batch
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { startExecution } from './.uap/runtime/status-engine/execution.mjs';
          const execution = startExecution('github-actions single-batch UAP acceptance');
          fs.appendFileSync(process.env.GITHUB_ENV, `UAP_BATCH_LOCK_ID=${execution.execution_id}\n`);
          console.log(JSON.stringify(execution, null, 2));
          NODE
      - name: Generate current UAP build evidence
        id: uap_build
        continue-on-error: true
        run: node .uap/bin/uap.mjs build
      # Run every UAP gate even when an earlier gate fails so CI preserves
      # complete evidence instead of skipping the self-test suite on validator failure.
      - name: UAP runtime health
        id: uap_doctor
        continue-on-error: true
        run: node .uap/bin/uap.mjs doctor
      - name: UAP registry and validator execution
        id: uap_validate
        continue-on-error: true
        env:
          H5_BASE_URL: http://127.0.0.1:3000
        run: node .uap/bin/uap.mjs validate --all
      - name: Publish H5 browser matrix diagnostics
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = '.uap/reports/H5-BROWSER-MATRIX.json';
          if (!fs.existsSync(p)) {
            console.log('H5-BROWSER-MATRIX.json not generated');
          } else {
            const r = JSON.parse(fs.readFileSync(p, 'utf8'));
            console.log(JSON.stringify({
              target: r.target, browser: r.browser, verdict: r.verdict,
              matrix_rows: r.matrix_rows,
              rows: (r.matrix || []).map(x => ({
                viewport: x.viewport, route: x.route, http_status: x.http_status,
                final_url: x.final_url, spa_rendered: x.spa_rendered,
                meta_viewport_ok: x.meta_viewport_ok,
                horizontal_overflow_px: x.horizontal_overflow_px,
                console_errors: x.console_errors, http_failures: x.http_failures,
                page_errors: x.page_errors,
              })),
            }, null, 2));
          }
          const log = process.env.RUNNER_TEMP + '/uap/uter-server.log';
          if (fs.existsSync(log)) {
            console.log('--- ISOLATED UTER SERVER LOG (TAIL) ---');
            console.log(fs.readFileSync(log, 'utf8').split('\n').slice(-80).join('\n'));
          }
          NODE
      - name: UAP complete self-test suite
        id: uap_test
        if: always()
        continue-on-error: true
        run: node .uap/bin/uap.mjs test --all
      - name: Publish full UAP self-test failure context
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = '.uap/reports/RUNTIME-TEST-RESULTS.json';
          if (!fs.existsSync(p)) {
            console.log('RUNTIME-TEST-RESULTS.json not generated');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            exit_code: report.exit_code,
            timed_out: report.timed_out,
            duration_ms: report.duration_ms,
            test_files: report.test_files,
            stderr_tail: report.stderr_tail,
          }, null, 2));
          const tap = String(report.stdout_tail || '');
          const lines = tap.split('\n');
          const failed = [];
          for (let i = 0; i < lines.length; i++) {
            if (/^not ok \d+/.test(lines[i]) || /failureType:|error:|AssertionError|ERR_/.test(lines[i])) {
              failed.push(lines.slice(Math.max(0, i - 5), Math.min(lines.length, i + 18)).join('\n'));
            }
          }
          console.log('--- TAP FAILURE CONTEXT ---');
          console.log(failed.length ? failed.join('\\n--- FAILURE ---\\n') : tap.slice(-12000));
          NODE
      - name: UAP real code repair and independent regression
        if: github.event_name == 'push'
        id: uap_capabilities
        continue-on-error: true
        run: node .uap/bin/uap.mjs verify-capabilities
      - name: UAP isolated database integration and migrations
        if: github.event_name == 'push'
        id: uap_database
        continue-on-error: true
        run: node .uap/bin/uap.mjs verify-database
      - name: UAP local payment simulation (no provider calls)
        if: github.event_name == 'push'
        id: uap_payment
        continue-on-error: true
        run: node .uap/bin/uap.mjs verify-payment
      - name: UAP browser E2E and accessibility verification
        if: github.event_name == 'push'
        id: uap_e2e
        continue-on-error: true
        env:
          VISUAL_BASE_URL: http://127.0.0.1:3000
          # Port 3000 is backed by this job's disposable SQLite + ephemeral session secret.
          # Both runners must receive their own explicit isolated-stack contract.
          UTER_TEST_STACK: isolated
          UAP_TEST_STACK: isolated
        run: node .uap/bin/uap.mjs verify-e2e
      - name: UAP visual regression verification
        if: github.event_name == 'push'
        id: uap_visual
        continue-on-error: true
        env:
          VISUAL_BASE_URL: http://127.0.0.1:3000
          UTER_TEST_STACK: isolated
          UAP_TEST_STACK: isolated
        run: node .uap/bin/uap.mjs verify-visual
      - name: UAP security negative tests and secret scan
        if: github.event_name == 'push'
        id: uap_security
        continue-on-error: true
        run: node .uap/bin/uap.mjs verify-security
      - name: UAP full requirement traceability verification (538 requirements)
        if: github.event_name == 'push'
        id: uap_requirements
        continue-on-error: true
        run: node .uap/bin/uap.mjs verify-requirements
      - name: Regenerate final UAP reports from current execution
        if: github.event_name == 'push'
        id: uap_report
        continue-on-error: true
        run: node .uap/bin/uap.mjs report --final
      - name: Run authoritative UAP final acceptance closure
        if: github.event_name == 'push'
        id: uap_accept
        continue-on-error: true
        run: node .uap/bin/uap.mjs accept
      - name: Publish authoritative UAP final acceptance status
        if: always() && github.event_name == 'push'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (p) => fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf8')) : null;
          const acceptance = read('.uap/reports/FINAL-ACCEPTANCE.json');
          const status = read('.uap/reports/FINAL-STATUS.json');
          const summary = {
            gate_status: acceptance?.status ?? 'NOT_RUN',
            claim_allowed: acceptance?.claim_allowed ?? false,
            overall_status: acceptance?.overall_status ?? 'NOT_RUN',
            gate_groups_pass: acceptance?.counts?.gate_groups_pass ?? null,
            gate_groups_fail: acceptance?.counts?.gate_groups_fail ?? null,
            necessary_blocked: acceptance?.counts?.necessary_blocked ?? null,
            necessary_unverified: acceptance?.counts?.necessary_unverified ?? null,
            uap_fully_operational: status?.final_acceptance?.uap_fully_operational ?? false,
            blocked_items: acceptance?.blocked_items ?? [],
            problems: acceptance?.problems ?? [],
          };
          console.log(JSON.stringify(summary, null, 2));
          if (summary.claim_allowed !== true) {
            console.log('::warning::UAP final acceptance is not fully verified; see blocked_items/problems above. This is not a PASS.');
          }
          NODE
      - name: Enforce UAP governance gate
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.uap_build.outcome }}
          DOCTOR_OUTCOME: ${{ steps.uap_doctor.outcome }}
          VALIDATE_OUTCOME: ${{ steps.uap_validate.outcome }}
          TEST_OUTCOME: ${{ steps.uap_test.outcome }}
          ACCEPTANCE_OUTCOME: ${{ steps.uap_accept.outcome }}
        run: |
          printf 'build=%s\\ndoctor=%s\\nvalidate=%s\\ntest=%s\\nfinal_acceptance=%s\\n' "$BUILD_OUTCOME" "$DOCTOR_OUTCOME" "$VALIDATE_OUTCOME" "$TEST_OUTCOME" "$ACCEPTANCE_OUTCOME"
          if [[ "$ACCEPTANCE_OUTCOME" != "success" ]]; then echo "::warning::Operational UAP gate passed/checked separately; final acceptance remains blocked or unverified."; fi
          test "$BUILD_OUTCOME" = success
          test "$DOCTOR_OUTCOME" = success
          test "$VALIDATE_OUTCOME" = success
          test "$TEST_OUTCOME" = success

  ueqe-review:
    name: UEQE review engine (all modules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
            tokenkit/tokenkit/go.sum
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Create frontend embed placeholder
        run: ./scripts/make-frontend-placeholder.sh
      - name: Run UEQE review stage
        run: bash scripts/quality/uter-quality.sh review

  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
            tokenkit/tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          # 只测后端：造一个最小的 embed 骨架让 go build 通过。
          # //go:embed web/dist/index.html 要求该文件在编译期真实存在。
          ./scripts/make-frontend-placeholder.sh

      - name: Check gofmt
        # 格式门禁：只检查受版本控制的 Go 文件，避免 node_modules / dist 之类的
        # 目录拖慢或误报。gofmt 只改空白与 import 顺序，不会改语义。
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt，请执行 gofmt -w 后提交："
            echo "$unformatted"
            while IFS= read -r file; do
              [ -n "$file" ] && gofmt -d "$file" || true
            done <<< "$unformatted"
            exit 1
          fi

      - name: golangci-lint (root module, new issues only)
        # golangci-lint v2 聚合 gofmt / govet / ineffassign / unused / staticcheck。
        # only-new-issues：push / pull_request 事件经 GitHub API 取 diff
        # （--new-from-patch），只拦本次变更引入的问题；存量 121 项问题为已知
        # 基线，不阻断（分批清理）。仅覆盖根模块；relaykit / tokenkit 为独立
        # Go 模块，暂沿用下方 go vet 门禁。嵌套 TokenKit 也是独立模块，必须单独验证。
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          only-new-issues: true

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: tokenkit
        run: GOWORK=off go vet ./...

      - name: Vet nested tokenkit/tokenkit independently
        working-directory: tokenkit/tokenkit
        run: GOWORK=off go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: tokenkit
        run: GOWORK=off go build ./...

      - name: Build nested tokenkit/tokenkit independently
        working-directory: tokenkit/tokenkit
        run: GOWORK=off go build ./...

      - name: Test root, relaykit, tokenkit, and nested tokenkit/tokenkit modules
        run: make test

  # 竞态检测：覆盖并发敏感且已验证无竞争的包。计费/钱包/组织权限/中继都在
  # 这些目录里，而 -race 会把测试耗时拉长数倍，全量跑会顶到 timeout。
  #
  # F-15：model 已纳入。原先它被排除，是因为同一处**测试隔离竞争**（非生产竞争）：
  #   DecreaseUserQuota 等路径用 gopool 起了 fire-and-forget 协程做缓存同步，
  #   协程末尾读 common.RedisEnabled / common.RDB；而测试会把这两个全局变量临时
  #   指向 miniredis 再还原。协程比测试体活得久，于是「cleanup 写 vs 协程读」相撞。
  #   生产环境这些全局量启动后不再改写，故不是线上缺陷。
  #   修法：缓存同步统一走 model.runCacheSync 登记到 WaitGroup，测试通过
  #   model.WaitCacheSyncForTest() 在改写/还原全局量前后各等一次（见
  #   model/user_cache.go 与 model/user_cache_auth_version_test.go 的
  #   useUserCacheMiniRedis / useFailingRedis）。修后连续 3 次 -race 0 竞争。
  #
  # e2e 也已纳入。此前它被排除，理由是「组织计费用例拿到 401 token 无效」——该
  # 问题已修复（测试夹具给非管理员用户误设 unlimited_quota，被生产规则强制置为
  # 有限额度后 remain_quota 缺省为 0，令牌开箱即耗尽）。修复后又暴露出第二处
  # 同型隔离竞争：relay 路径上 perf_metrics.RecordRelayResult 用 gopool 起的
  # 落库协程读 common.RedisEnabled / common.RDB，而 harness 的 t.Cleanup 会
  # 改写并还原它们。修法同样是加屏障：perfmetrics.WaitRecordForTest()，
  # 由 e2e/org_platform_harness_test.go 在改写与还原前后各调用一次。
  race:
    name: Backend race detector
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
            tokenkit/tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          # 只测后端：造一个最小的 embed 骨架让 go build 通过。
          # //go:embed web/dist/index.html 要求该文件在编译期真实存在。
          ./scripts/make-frontend-placeholder.sh

      - name: Race test concurrency-sensitive packages
        run: go test -race -count=1 ./service/... ./relay/... ./middleware/... ./model/...

      # e2e 单独一步：它是覆盖组织计费全链路的最重的一套用例，-race 下耗时
      # 数分钟，与上面的单元测试分开跑便于定位是哪一侧出的问题。
      - name: Race test end-to-end billing flows
        run: go test -race -count=1 ./e2e/...

      - name: Race test relaykit module
        working-directory: relaykit
        run: GOWORK=off go test -race -count=1 ./...

      - name: Race test tokenkit module
        working-directory: tokenkit
        run: GOWORK=off go test -race -count=1 ./...

      - name: Race test nested TokenKit module
        working-directory: tokenkit/tokenkit
        run: GOWORK=off go test -race -count=1 ./...

  # 覆盖率报告 + 门禁：既产出可追踪的工件，也对关键包设下限。
  # 门槛只覆盖资金/权限所在的包，且取当前基线往下留 2 个点——总覆盖率会被
  # 体量大的低风险包稀释，单看一个总数挡不住「成批删掉支付测试」。
  coverage:
    name: Backend coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
            tokenkit/tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          # 只测后端：造一个最小的 embed 骨架让 go build 通过。
          # //go:embed web/dist/index.html 要求该文件在编译期真实存在。
          ./scripts/make-frontend-placeholder.sh

      - name: Test root module with coverage
        # 用 xargs 传包列表：直接展开多行 shell 变量在部分 shell 里不会按空白
        # 拆分，会把整串当成一个 import path 报 malformed。
        run: |
          go list -e ./... | grep -vxF "$(go list -m)" \
            | xargs go test -covermode=set -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Collect independent Go module coverage
        run: |
          set -o pipefail
          for module in relaykit tokenkit tokenkit/tokenkit; do
            label="${module//\//-}"
            (
              cd "$module"
              GOWORK=off go test -count=1 -covermode=atomic -coverprofile="$RUNNER_TEMP/${label}.coverage.out" ./...
              go tool cover -func="$RUNNER_TEMP/${label}.coverage.out" | tail -1
            )
          done

      # F-15：关键路径覆盖率下限。基线（本次测量）：controller 41.6%、
      # model 47.7%、service 45.7%、middleware 66.4%。阈值各留约 2 个点余量，
      # 既容得下正常重构，又能挡住成批删除测试。
      - name: Enforce critical-path coverage thresholds
        run: |
          ./scripts/coverage-gate.sh coverage.out "$(go list -m)" \
            controller=39 \
            model=45 \
            service=43 \
            middleware=62

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 14

  # Go 依赖漏洞扫描：覆盖四个独立模块各自的 go.mod。
  vulnscan:
    name: Go dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Install govulncheck (pinned) and put Go bin on PATH
        # F-14: the previous job ran `go install ...@latest` and then called
        # `govulncheck` directly, but $(go env GOPATH)/bin is not on PATH in the
        # runner, so the scan never actually executed ("govulncheck: command not
        # found"). Install once, pin the version (no @latest drift), and export
        # GOPATH/bin onto PATH for the scans below.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "PATH=$PATH:$(go env GOPATH)/bin" >> "$GITHUB_ENV"

      - name: Scan root module
        run: govulncheck ./...

      - name: Scan relaykit
        working-directory: relaykit
        run: govulncheck ./...

      - name: Scan tokenkit
        working-directory: tokenkit
        run: govulncheck ./...

      # 嵌套模块 tokenkit/tokenkit 是独立的 Go module（自己的 go.mod/go.sum），
      # 不被上面任何一个 `./...` 覆盖。漏掉它等于「根模块通过就以为全部通过」。
      - name: Scan nested tokenkit/tokenkit
        working-directory: tokenkit/tokenkit
        run: govulncheck ./...

  # 桌面端（Electron）密钥持久化。
  #
  # SESSION_SECRET / CRYPTO_SECRET 必须跨重启稳定，否则重启后刷新令牌校验、
  # 加密数据与带签名的任务资源链接全部失效。这些行为只在 Node 侧实现，
  # Go 测试覆盖不到，因此单独设一道门禁。用 Node 内置 test runner，
  # 不需要安装 Electron 运行时。
  desktop:
    name: Electron desktop secret persistence
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      # electron/ 已有 CI 覆盖，按仓库 SHA 台账统一 pin 到 v6.4.0。
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Syntax check Electron main process
        working-directory: electron
        run: node --check main.js

      - name: Test desktop secret persistence
        working-directory: electron
        run: node --test desktop-secrets.test.js

  frontend:
    name: Frontend typecheck, tests, lint and production build
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Validate API documentation deprecation filter
        working-directory: .
        run: |
          python3 -m py_compile scripts/docs-sync/sync-upstream-docs.py
          python3 scripts/docs-sync/test_sync_upstream_docs.py

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      # 设计令牌门禁（规范 §1.1 颜色 / §1.2 字号 / §1.3 圆角 / §1.5 投影 /
      # §1.6 动效）：任意字号、裸色值、非浮层投影、任意圆角、未登记动效等
      # 违规一律阻断合并。
      #
      # 为什么必须设成必需：此前这项只挂在 `lint:design` 脚本上、靠本地手动
      # 跑，CI 完全不拦 —— 违规能畅通合入，只能等人工审计才发现，正是
      # 「审计越做越出问题」的来源之一。
      #
      # 图标几何、正文基准、焦点环那几组由上面的 `bun run test`
      # （design-system/__tests__/spec-guards.test.ts）兜底。
      - name: Design token source sync
        run: bun run design:tokens:check

      # §28.3 / §18.1：核查页的页内内联快照必须与 TOKEN-MANIFEST 逐值一致，
      # 否则 file:// 单文件打开会展示旧值（历史上曾因此被迫起本地 HTTP 服务）。
      - name: Design showcase data chain
        run: bun run design:showcase:check

      - name: Brand contrast verification
        run: bun run verify:contrast

      - name: Design tokens
        run: bun run lint:design:strict

      - name: Install pinned Playwright Chromium
        run: bunx playwright install chromium

      - name: Visual layout, keyboard and accessibility audit
        run: bun run test:visual

      # Canonical React UI component registry, contract shape and filesystem parity.
      - name: React component registry
        run: bun run components:registry:check

      # UTER Design System 8.0.0：唯一现行设计系统规范。自动化检查器覆盖 Token 真源
      # 一致性、注册表齐全性、1001 点渐变对比度、VS Code 语法映射、Showcase 完整性、
      # 状态纪律、真实页面回归、axe 无障碍与 Clerk 外部参考边界（C01-C22）。
      # 纯静态与本地产物只读检查，不降低 T1-T17、ALLOWLIST 或 baseline 阈值。
      - name: Design system 8.0.0 governance
        run: bun run design:8:check

      # 版权头检查：只补缺失的 AGPL 头，不动任何代码格式，可安全设为必需。
      # 格式检查（format:check）**不要**设为必需：它按仓库根目录递归跑 oxfmt，
      # 会把 public/plugins 下的第三方插件与根级配置文件一起格式化，当前有
      # 248 个文件不合规（含 190+ 项目源文件），设成必需会让 CI 立刻全红。
      # 待格式基线统一后再纳入。
      - name: Copyright headers
        run: bun run copyright:check

      - name: Build production frontend
        run: bun run build:check
