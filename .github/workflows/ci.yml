name: CI

on:
  push:
    branches: [main, 'audit/**']
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  # only-new-issues 在 pull_request 事件下经 GitHub API 取 PR diff，需要本只读权限。
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checkout the event commit in both jobs. A PR merge ref can disappear while
# queued runs start, and a base branch can advance after the merge event.
jobs:
  uaes-integration:
    name: UAES integration contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate UAES integration wiring
        run: bash scripts/quality/uaes-integration-check.sh


  ueqe-review:
    name: UEQE review engine (all modules + AI spec integrity)
    needs: uaes-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
            tokenkit/tokenkit/go.sum
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Create frontend embed placeholder
        run: ./scripts/make-frontend-placeholder.sh
      - name: Run UEQE review stage
        run: bash scripts/quality/uter-quality.sh review

  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
            tokenkit/tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          # 只测后端：造一个最小的 embed 骨架让 go build 通过。必须包含
          # docs-content/_next，否则 //go:embed all:web/dist/docs-content/_next
          # 会因找不到匹配文件而编译失败。
          ./scripts/make-frontend-placeholder.sh

      - name: Check gofmt
        # 格式门禁：只检查受版本控制的 Go 文件，避免 node_modules / dist 之类的
        # 目录拖慢或误报。gofmt 只改空白与 import 顺序，不会改语义。
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt，请执行 gofmt -w 后提交："
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint (root module, new issues only)
        # golangci-lint v2 聚合 gofmt / govet / ineffassign / unused / staticcheck。
        # only-new-issues：push / pull_request 事件经 GitHub API 取 diff
        # （--new-from-patch），只拦本次变更引入的问题；存量 121 项问题为已知
        # 基线，不阻断（分批清理）。仅覆盖根模块；relaykit / tokenkit 为独立
        # Go 模块，暂沿用下方 go vet 门禁。嵌套 TokenKit 也是独立模块，必须单独验证。
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.15.0
          only-new-issues: true

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: tokenkit
        run: GOWORK=off go vet ./...

      - name: Vet nested tokenkit/tokenkit independently
        working-directory: tokenkit/tokenkit
        run: GOWORK=off go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: tokenkit
        run: GOWORK=off go build ./...

      - name: Build nested tokenkit/tokenkit independently
        working-directory: tokenkit/tokenkit
        run: GOWORK=off go build ./...

      - name: Test root, relaykit, tokenkit, and nested tokenkit/tokenkit modules
        run: make test

  # 竞态检测：覆盖并发敏感且已验证无竞争的包。计费/钱包/组织权限/中继都在
  # 这些目录里，而 -race 会把测试耗时拉长数倍，全量跑会顶到 timeout。
  #
  # F-15：model 已纳入。原先它被排除，是因为同一处**测试隔离竞争**（非生产竞争）：
  #   DecreaseUserQuota 等路径用 gopool 起了 fire-and-forget 协程做缓存同步，
  #   协程末尾读 common.RedisEnabled / common.RDB；而测试会把这两个全局变量临时
  #   指向 miniredis 再还原。协程比测试体活得久，于是「cleanup 写 vs 协程读」相撞。
  #   生产环境这些全局量启动后不再改写，故不是线上缺陷。
  #   修法：缓存同步统一走 model.runCacheSync 登记到 WaitGroup，测试通过
  #   model.WaitCacheSyncForTest() 在改写/还原全局量前后各等一次（见
  #   model/user_cache.go 与 model/user_cache_auth_version_test.go 的
  #   useUserCacheMiniRedis / useFailingRedis）。修后连续 3 次 -race 0 竞争。
  #
  # e2e 也已纳入。此前它被排除，理由是「组织计费用例拿到 401 token 无效」——该
  # 问题已修复（测试夹具给非管理员用户误设 unlimited_quota，被生产规则强制置为
  # 有限额度后 remain_quota 缺省为 0，令牌开箱即耗尽）。修复后又暴露出第二处
  # 同型隔离竞争：relay 路径上 perf_metrics.RecordRelayResult 用 gopool 起的
  # 落库协程读 common.RedisEnabled / common.RDB，而 harness 的 t.Cleanup 会
  # 改写并还原它们。修法同样是加屏障：perfmetrics.WaitRecordForTest()，
  # 由 e2e/org_platform_harness_test.go 在改写与还原前后各调用一次。
  race:
    name: Backend race detector
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
            tokenkit/tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          # 只测后端：造一个最小的 embed 骨架让 go build 通过。必须包含
          # docs-content/_next，否则 //go:embed all:web/dist/docs-content/_next
          # 会因找不到匹配文件而编译失败。
          ./scripts/make-frontend-placeholder.sh

      - name: Race test concurrency-sensitive packages
        run: go test -race -count=1 ./service/... ./relay/... ./middleware/... ./model/...

      # e2e 单独一步：它是覆盖组织计费全链路的最重的一套用例，-race 下耗时
      # 数分钟，与上面的单元测试分开跑便于定位是哪一侧出的问题。
      - name: Race test end-to-end billing flows
        run: go test -race -count=1 ./e2e/...

      - name: Race test relaykit module
        working-directory: relaykit
        run: GOWORK=off go test -race -count=1 ./...

      - name: Race test tokenkit module
        working-directory: tokenkit
        run: GOWORK=off go test -race -count=1 ./...

      - name: Race test nested TokenKit module
        working-directory: tokenkit/tokenkit
        run: GOWORK=off go test -race -count=1 ./...

  # 覆盖率报告 + 门禁：既产出可追踪的工件，也对关键包设下限。
  # 门槛只覆盖资金/权限所在的包，且取当前基线往下留 2 个点——总覆盖率会被
  # 体量大的低风险包稀释，单看一个总数挡不住「成批删掉支付测试」。
  coverage:
    name: Backend coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
            tokenkit/tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          # 只测后端：造一个最小的 embed 骨架让 go build 通过。必须包含
          # docs-content/_next，否则 //go:embed all:web/dist/docs-content/_next
          # 会因找不到匹配文件而编译失败。
          ./scripts/make-frontend-placeholder.sh

      - name: Test root module with coverage
        # 用 xargs 传包列表：直接展开多行 shell 变量在部分 shell 里不会按空白
        # 拆分，会把整串当成一个 import path 报 malformed。
        run: |
          go list -e ./... | grep -vxF "$(go list -m)" \
            | xargs go test -covermode=set -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Collect independent Go module coverage
        run: |
          set -o pipefail
          for module in relaykit tokenkit tokenkit/tokenkit; do
            label="${module//\//-}"
            (
              cd "$module"
              GOWORK=off go test -count=1 -covermode=atomic -coverprofile="$RUNNER_TEMP/${label}.coverage.out" ./...
              go tool cover -func="$RUNNER_TEMP/${label}.coverage.out" | tail -1
            )
          done

      # F-15：关键路径覆盖率下限。基线（本次测量）：controller 41.6%、
      # model 47.7%、service 45.7%、middleware 66.4%。阈值各留约 2 个点余量，
      # 既容得下正常重构，又能挡住成批删除测试。
      - name: Enforce critical-path coverage thresholds
        run: |
          ./scripts/coverage-gate.sh coverage.out "$(go list -m)" \
            controller=39 \
            model=45 \
            service=43 \
            middleware=62

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 14

  # Go 依赖漏洞扫描：覆盖四个独立模块各自的 go.mod。
  vulnscan:
    name: Go dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Install govulncheck (pinned) and put Go bin on PATH
        # F-14: the previous job ran `go install ...@latest` and then called
        # `govulncheck` directly, but $(go env GOPATH)/bin is not on PATH in the
        # runner, so the scan never actually executed ("govulncheck: command not
        # found"). Install once, pin the version (no @latest drift), and export
        # GOPATH/bin onto PATH for the scans below.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "PATH=$PATH:$(go env GOPATH)/bin" >> "$GITHUB_ENV"

      - name: Scan root module
        run: govulncheck ./...

      - name: Scan relaykit
        working-directory: relaykit
        run: govulncheck ./...

      - name: Scan tokenkit
        working-directory: tokenkit
        run: govulncheck ./...

      # 嵌套模块 tokenkit/tokenkit 是独立的 Go module（自己的 go.mod/go.sum），
      # 不被上面任何一个 `./...` 覆盖。漏掉它等于「根模块通过就以为全部通过」。
      - name: Scan nested tokenkit/tokenkit
        working-directory: tokenkit/tokenkit
        run: govulncheck ./...

  # 桌面端（Electron）密钥持久化。
  #
  # SESSION_SECRET / CRYPTO_SECRET 必须跨重启稳定，否则重启后刷新令牌校验、
  # 加密数据与带签名的任务资源链接全部失效。这些行为只在 Node 侧实现，
  # Go 测试覆盖不到，因此单独设一道门禁。用 Node 内置 test runner，
  # 不需要安装 Electron 运行时。
  desktop:
    name: Electron desktop secret persistence
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      # electron/ 已有 CI 覆盖，按仓库 SHA 台账统一 pin 到 v6.4.0。
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Syntax check Electron main process
        working-directory: electron
        run: node --check main.js

      - name: Test desktop secret persistence
        working-directory: electron
        run: node --test desktop-secrets.test.js

  frontend:
    name: Frontend typecheck, tests, lint and production build
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      # 设计令牌门禁（规范 §1.1 颜色 / §1.2 字号 / §1.3 圆角 / §1.5 投影 /
      # §1.6 动效）：任意字号、裸色值、非浮层投影、任意圆角、未登记动效等
      # 违规一律阻断合并。
      #
      # 为什么必须设成必需：此前这项只挂在 `lint:design` 脚本上、靠本地手动
      # 跑，CI 完全不拦 —— 违规能畅通合入，只能等人工审计才发现，正是
      # 「审计越做越出问题」的来源之一。
      #
      # 图标几何、正文基准、焦点环那几组由上面的 `bun run test`
      # （design-system/__tests__/spec-guards.test.ts）兜底。
      - name: Design tokens
        run: bun run lint:design:strict

      # 版权头检查：只补缺失的 AGPL 头，不动任何代码格式，可安全设为必需。
      # 格式检查（format:check）**不要**设为必需：它按仓库根目录递归跑 oxfmt，
      # 会把 public/plugins 下的第三方插件与根级配置文件一起格式化，当前有
      # 248 个文件不合规（含 190+ 项目源文件），设成必需会让 CI 立刻全红。
      # 待格式基线统一后再纳入。
      - name: Copyright headers
        run: bun run copyright:check

      - name: Build production frontend
        run: bun run build:check
