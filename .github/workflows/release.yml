name: Release (Linux, macOS, Windows)
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
  push:
    tags:
      - '*'
      - '!*-alpha*'

jobs:
  # 发布门禁：测试、vet、构建、漏洞扫描、桌面端与前端检查全部通过后才允许
  # 进入构建与发布。任何一项失败，下面的 linux/macos/windows 作业都不会启动
  # ——不会产出一个测试没过或带已知漏洞的版本。
  gate:
    name: Release gate (tests, vet, build, vulnerability scan)
    uses: ./.github/workflows/release-gate.yml

  linux:
    name: Linux Release
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --match 'v[0-9]*')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      # 文档已收敛进 SPA：MDX 正文编译成异步 chunk，7 份搜索索引与
      # user-guide 截图由上面的 `bun run build` 从 web/public 拷进 web/dist。
      # 不再有第二个静态站需要单独构建；发布前的
      # scripts/verify-docs-artifacts.sh 会把缺产物挡在发布步骤之外。
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build Backend (amd64)
        run: |
          go mod download
          go build -ldflags "-s -w -X 'uter/common.Version=$VERSION' -extldflags '-static'" -o uter-$VERSION
      - name: Build Backend (arm64)
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X 'uter/common.Version=$VERSION' -extldflags '-static'" -o uter-arm64-$VERSION
      # 发布前完整性检查：产物必须同时包含 SPA 外壳、文档 chunk、7 份搜索
      # 索引与截图，缺任何一个都不允许进入发布步骤。
      - name: Verify release artifacts
        run: |
          ./scripts/verify-docs-artifacts.sh web/dist
          for binary in "uter-$VERSION" "uter-arm64-$VERSION"; do
            if [ ! -s "$binary" ]; then
              echo "::error::missing or empty binary: $binary"
              exit 1
            fi
          done
          echo "release artifacts verified for $VERSION"
      - name: Generate checksums
        run: sha256sum uter-* > checksums-linux.txt

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            uter-*
            checksums-linux.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS Release
    needs: gate
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --match 'v[0-9]*')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build Backend
        run: |
          go mod download
          go build -ldflags "-X 'uter/common.Version=$VERSION'" -o uter-macos-$VERSION
      - name: Verify release artifacts
        run: |
          ./scripts/verify-docs-artifacts.sh web/dist
          if [ ! -s "uter-macos-$VERSION" ]; then
            echo "::error::missing or empty binary: uter-macos-$VERSION"
            exit 1
          fi
          echo "release artifacts verified for $VERSION"
      - name: Generate checksums
        run: shasum -a 256 uter-macos-* > checksums-macos.txt

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            uter-macos-*
            checksums-macos.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows Release
    needs: gate
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --match 'v[0-9]*')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build Backend
        run: |
          go mod download
          go build -ldflags "-s -w -X 'uter/common.Version=$VERSION'" -o uter-$VERSION.exe
      - name: Verify release artifacts
        run: |
          ./scripts/verify-docs-artifacts.sh web/dist
          if [ ! -s "uter-$VERSION.exe" ]; then
            echo "::error::missing or empty binary: uter-$VERSION.exe"
            exit 1
          fi
          echo "release artifacts verified for $VERSION"
      - name: Generate checksums
        run: sha256sum uter-*.exe > checksums-windows.txt

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            uter-*.exe
            checksums-windows.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
