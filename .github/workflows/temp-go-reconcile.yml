name: temp-go-reconcile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Reconcile go.mod/go.sum and gofmt
        run: |
          go mod tidy
          gofmt -w controller/payment_recovery_fault_injection_test.go
          (cd tokenkit && go mod tidy) || true
          (cd tokenkit/tokenkit && go mod tidy) || true
          (cd relaykit && go mod tidy) || true
          git status --short
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "chore(deps): reconcile go.mod/go.sum via go mod tidy (CI-run, safe-merge pass)"
          git push origin main
