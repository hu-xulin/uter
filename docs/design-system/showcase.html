<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-density="Default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>UTER Design System 3.0 · Token Showcase</title>
<!--
  UTER Design System 3.0 · 数据驱动展示页

  本页不保存任何设计值。所有色值 / 字号 / 尺寸 / 区域清单都在运行时从
  UTER-DESIGN-SYSTEM-3.0.md §28 的 TOKEN-MANIFEST 代码块解析得到：
    · HTTP(S) 打开 → fetch 规范原文，改规范的值后刷新本页即生效
    · file://  打开 → 读取同目录 showcase.tokens.js 离线快照
                      （由 web/scripts/sync-design-showcase.mjs 从同一 Manifest 生成）

  规范 §18.1 / §28.2 · 禁止在本页内置 :root Token 副本。
  §28.3 的「展示页无 Token 副本」校验会扫描下方 :root，禁止出现任何 Manifest 声明值。
-->
<style>
  :root {
    color-scheme: light;
    /* 降级可读性占位 —— 只在 Manifest 加载失败时生效。
       刻意使用不落在 §28 任何刻度上的中性值，以免成为第二份设计值真源；
       全部实际值由 applyTokens() / applyTheme() / applyDensity() 从 §28 注入。
       禁止把这些 fallback 改成与规范一致的值。 */
    --m-bg: #fff;
    --m-card: #fff;
    --m-muted: #ececec;
    --m-subtle: #f6f6f6;
    --m-border: #d8d8d8;
    --m-fg: #202124;
    --m-fg-2: #5f6368;
    --m-fg-3: #80868b;
    --m-fg-disabled: #9aa0a6;
    --m-brand: #6b6b6b;
    --m-brand-fg: #fff;
    --m-brand-soft: #ededed;
    --m-brand-soft-fg: #3c3c3c;
    --m-r-md: 0.3rem;
    --m-r-lg: 0.4rem;
    --m-r-sm: 0.2rem;
    --m-sp-1: 0.2rem;
    --m-sp-2: 0.4rem;
    --m-sp-3: 0.7rem;
    --m-sp-4: 0.9rem;
    --m-sp-6: 1.3rem;
    --m-fs-body: 0.95rem;
    --m-fs-small: 0.8rem;
    --m-fs-h1: 1.6rem;
    --m-fs-h2: 1.3rem;
    --m-fs-h3: 1.1rem;
    --m-focus-ring: 1.5px;
    --m-dur-fast: 0.01s;
    --m-ease: linear;
    --m-density-pad: 1.3rem;
    --m-density-control: 2.3rem;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--m-bg);
    color: var(--m-fg);
    font-family: Inter, "Source Han Sans SC", "Noto Sans CJK SC", -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: var(--m-fs-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  code, .mono, .val {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--m-sp-3);
    padding: var(--m-sp-3) var(--m-sp-6);
    background: var(--m-card);
    border-bottom: 1px solid var(--m-border);
  }
  .brand { display: flex; align-items: baseline; gap: var(--m-sp-2); margin-right: auto; }
  .brand strong { font-size: var(--m-fs-h3); font-weight: 600; letter-spacing: -0.01em; }
  .brand span { color: var(--m-fg-3); font-size: var(--m-fs-small); }
  .badge {
    display: inline-flex; align-items: center; gap: 0.4em;
    padding: 0.2em 0.7em; border-radius: 999px;
    font-size: var(--m-fs-small); font-weight: 500;
    border: 1px solid var(--m-border); background: var(--m-subtle);
    color: var(--m-fg-2);
  }
  .badge.live { color: #166534; border-color: #86efac; background: #f0fdf4; }
  .badge.snapshot { color: #92400e; border-color: #fcd34d; background: #fffbeb; }
  .badge.error { color: #991b1b; border-color: #fca5a5; background: #fef2f2; }
  .dot { width: 0.5em; height: 0.5em; border-radius: 50%; background: currentColor; }
  .ctl {
    font: inherit; font-size: var(--m-fs-small); font-weight: 500;
    padding: 0.35em 0.8em; border-radius: var(--m-r-md);
    border: 1px solid var(--m-border); background: var(--m-card); color: var(--m-fg);
    cursor: pointer; transition: background var(--m-dur-fast) var(--m-ease);
  }
  .ctl:hover { background: var(--m-muted); }
  .ctl[aria-pressed="true"] { background: var(--m-brand); color: var(--m-brand-fg); border-color: transparent; }
  .ctl:focus-visible { outline: var(--m-focus-ring) solid var(--m-brand); outline-offset: 0; }
  .ctl-group { display: inline-flex; gap: 0.3em; }

  .layout { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: var(--m-sp-6);
            max-width: 100rem; margin: 0 auto; padding: var(--m-sp-6); }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav.toc { position: static !important; max-height: none !important; } }
  nav.toc {
    position: sticky; top: 5rem; align-self: start; max-height: calc(100vh - 7rem);
    overflow: auto; padding-right: var(--m-sp-2);
    border-right: 1px solid var(--m-border);
  }
  nav.toc h2 { font-size: var(--m-fs-small); text-transform: uppercase; letter-spacing: 0.08em;
               color: var(--m-fg-3); margin: 0 0 var(--m-sp-3); font-weight: 600; }
  nav.toc a {
    display: flex; gap: 0.6em; padding: 0.28em 0.5em; border-radius: var(--m-r-sm);
    color: var(--m-fg-2); text-decoration: none; font-size: var(--m-fs-small);
  }
  nav.toc a:hover { background: var(--m-muted); color: var(--m-fg); }
  nav.toc a .n { color: var(--m-fg-3); min-width: 1.6em; text-align: right; }

  main { min-width: 0; }
  .hero { margin-bottom: var(--m-sp-6); }
  .hero h1 { font-size: var(--m-fs-h1); font-weight: 600; line-height: 1.25; margin: 0 0 var(--m-sp-2); }
  .hero p { color: var(--m-fg-2); margin: 0; max-width: 68ch; }
  .meta-grid { display: flex; flex-wrap: wrap; gap: var(--m-sp-2); margin-top: var(--m-sp-4); }
  .meta-grid .badge { font-family: ui-monospace, monospace; }

  section.demo {
    scroll-margin-top: 5rem;
    background: var(--m-card); border: 1px solid var(--m-border);
    border-radius: var(--m-r-lg); padding: var(--m-density-pad);
    margin-bottom: var(--m-sp-6);
  }
  section.demo > h2 {
    font-size: var(--m-fs-h2); font-weight: 600; line-height: 1.35;
    margin: 0 0 var(--m-sp-2); display: flex; align-items: baseline; gap: 0.7em; flex-wrap: wrap;
  }
  section.demo > h2 .no { font-size: var(--m-fs-small); font-weight: 500; color: var(--m-brand);
                          background: var(--m-brand-soft); border-radius: 999px; padding: 0.15em 0.7em; }
  section.demo > h2 .spec { font: inherit; font-size: var(--m-fs-small); font-weight: 400; color: var(--m-fg-3); }
  .lede { color: var(--m-fg-2); font-size: var(--m-fs-small); margin: 0 0 var(--m-sp-4); }
  h3.sub { font-size: var(--m-fs-h3); font-weight: 600; margin: var(--m-sp-6) 0 var(--m-sp-2); }
  h3.sub:first-of-type { margin-top: var(--m-sp-4); }

  table { width: 100%; border-collapse: collapse; font-size: var(--m-fs-small); }
  th, td { text-align: left; padding: 0.5em 0.7em; border-bottom: 1px solid var(--m-border); vertical-align: middle; }
  th { font-weight: 500; color: var(--m-fg-3); background: var(--m-subtle); white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: none; }
  .val { color: var(--m-fg-2); white-space: nowrap; font-size: 0.95em; }
  .copy { border: 0; background: transparent; color: var(--m-fg-3); cursor: pointer;
          font: inherit; font-size: 0.9em; padding: 0.1em 0.35em; border-radius: var(--m-r-sm); }
  .copy:hover { color: var(--m-brand); background: var(--m-brand-soft); }
  .copy:focus-visible { outline: var(--m-focus-ring) solid var(--m-brand); outline-offset: 0; }

  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: var(--m-sp-3); }
  .swatch { border: 1px solid var(--m-border); border-radius: var(--m-r-md); overflow: hidden; }
  .swatch .chip { height: 3.2rem; display: flex; align-items: center; justify-content: center;
                  font-size: var(--m-fs-small); font-weight: 500; }
  .swatch .lbl { padding: 0.45em 0.7em; background: var(--m-card); }
  .swatch .lbl b { display: block; font-size: var(--m-fs-small); font-weight: 500; }
  .swatch .lbl small { display: block; color: var(--m-fg-3); font-size: 0.9em; }
  .ratio { font-variant-numeric: tabular-nums; font-weight: 600; }
  .pass { color: #15803d; } .fail { color: #b91c1c; } .pending { color: #a16207; }

  .row { display: flex; align-items: center; gap: var(--m-sp-3); flex-wrap: wrap; }
  .stack { display: grid; gap: var(--m-sp-2); }
  .box {
    border: 1px solid var(--m-border); border-radius: var(--m-r-md);
    background: var(--m-subtle); padding: var(--m-sp-3);
  }
  .box.card-look { background: var(--m-card); border-radius: var(--m-r-lg); padding: var(--m-density-pad); }
  .sample-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .radius-box { width: 4.5rem; height: 3.2rem; background: var(--m-brand); flex: none; }
  .space-bar { height: 1rem; background: var(--m-brand-soft); border-left: 2px solid var(--m-brand); }
  .shadow-box { background: var(--m-card); border: 1px solid var(--m-border);
                border-radius: var(--m-r-md); padding: var(--m-sp-4); min-height: 3.5rem; }
  .icon-box { display: inline-flex; align-items: center; justify-content: center;
              border: 1px solid var(--m-border); border-radius: var(--m-r-sm); background: var(--m-subtle); }

  .btn {
    font: inherit; font-size: var(--m-fs-small); font-weight: 500;
    border-radius: var(--m-r-md); border: 1px solid transparent;
    background: var(--m-brand); color: var(--m-brand-fg);
    padding: 0 var(--m-sp-4); height: var(--m-density-control);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background var(--m-dur-fast) var(--m-ease);
  }
  .btn:focus-visible { outline: var(--m-focus-ring) solid var(--m-brand); outline-offset: 0; }
  .btn.secondary { background: var(--m-muted); color: var(--m-fg); }
  .btn.outline { background: transparent; border-color: var(--m-border); color: var(--m-fg); }
  .btn.ghost { background: transparent; color: var(--m-fg-2); }
  .btn.destructive { background: #dc2626; color: #fff; }
  .btn.link { background: transparent; color: var(--m-brand-soft-fg); height: auto; padding: 0; text-decoration: underline; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .input {
    font: inherit; font-size: var(--m-fs-small); height: var(--m-density-control);
    border: 1px solid var(--m-border); border-radius: var(--m-r-md);
    background: var(--m-card); color: var(--m-fg); padding: 0 var(--m-sp-3); min-width: 12rem;
  }
  .input::placeholder { color: var(--m-fg-disabled); }
  .input:focus-visible { outline: var(--m-focus-ring) solid var(--m-brand); outline-offset: 0; }
  .input[aria-invalid="true"] { border-color: #dc2626; }
  .badge-ui { display: inline-flex; align-items: center; padding: 0.15em 0.6em;
              border-radius: 999px; font-size: var(--m-fs-small); font-weight: 500;
              background: var(--m-brand-soft); color: var(--m-brand-soft-fg); }
  .gradient-text {
    font-size: var(--m-fs-h1); font-weight: 700; line-height: 1.3;
    background: linear-gradient(90deg, var(--m-grad-from), var(--m-grad-via), var(--m-grad-to));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .term {
    background: #000; color: #e2e8f0; border-radius: var(--m-r-md);
    padding: var(--m-sp-4); overflow-x: auto; font-family: ui-monospace, monospace;
    font-size: var(--m-fs-small); line-height: 1.7;
  }
  .code { background: var(--m-subtle); border: 1px solid var(--m-border);
          border-radius: var(--m-r-md); padding: var(--m-sp-4); overflow-x: auto;
          font-size: var(--m-fs-small); line-height: 1.7; }
  .chain { display: grid; gap: var(--m-sp-2); }
  .chain .node { border: 1px solid var(--m-border); border-left: 3px solid var(--m-brand);
                 border-radius: var(--m-r-sm); padding: var(--m-sp-3) var(--m-sp-4);
                 background: var(--m-subtle); font-size: var(--m-fs-small); }
  .chain .node b { color: var(--m-brand-soft-fg); }
  footer { color: var(--m-fg-3); font-size: var(--m-fs-small); padding: var(--m-sp-6) 0; text-align: center; }
  #boot-error { margin: var(--m-sp-6); padding: var(--m-sp-4); border: 1px solid #fca5a5;
                border-radius: var(--m-r-md); background: #fef2f2; color: #991b1b; }
</style>
</head>
<body>
<div id="boot-error" hidden></div>

<header class="topbar">
  <div class="brand"><strong>UTER Design System</strong><span>Token Showcase · 3.0</span></div>
  <span class="badge" id="source-badge"><span class="dot"></span>加载 Token Manifest…</span>
  <div class="ctl-group" id="density-controls" role="group" aria-label="密度切换"></div>
  <button class="ctl" id="theme-toggle" type="button" aria-pressed="false">切换深色</button>
</header>

<div class="layout">
  <nav class="toc" id="nav" aria-label="展示区域导航"></nav>
  <main id="main">
    <div class="hero">
      <h1>设计系统可视核查</h1>
      <p>本页所有数值、色板、尺寸与区域清单均实时解析自
        <code>UTER-DESIGN-SYSTEM-3.0.md</code> §28 的 <code>TOKEN-MANIFEST</code>。
        页面自身样式也由同一份声明注入 CSS 变量驱动 —— 修改规范中的值，刷新本页即随之调整。</p>
      <div class="meta-grid" id="meta-grid"></div>
    </div>
    <div id="sections"></div>
  </main>
</div>

<footer id="footer"></footer>

<script>
(function () {
  'use strict';

  var SPEC_FILE = './UTER-DESIGN-SYSTEM-3.0.md';
  var SNAPSHOT_FILE = './showcase.tokens.js';
  var M = null;
  var source = 'live';
  var snapshotGeneratedAt = null;
  var theme = 'light';
  var density = 'Default';

  /* ── 1. 读取唯一声明源 ───────────────────────────────────────────── */
  function extractManifest(md) {
    var block = md.match(/<!--\s*TOKEN-MANIFEST:BEGIN\s*-->([\s\S]*?)<!--\s*TOKEN-MANIFEST:END\s*-->/);
    if (!block) throw new Error('规范中未找到 TOKEN-MANIFEST 标记块');
    var json = block[1].match(/```json\s*([\s\S]*?)```/);
    if (!json) throw new Error('TOKEN-MANIFEST 块中没有 json 代码块');
    return JSON.parse(json[1]);
  }

  function loadSnapshot() {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = SNAPSHOT_FILE;
      s.onload = function () {
        if (!window.__UTER_TOKEN_MANIFEST__) { reject(new Error('快照文件未导出 Manifest')); return; }
        snapshotGeneratedAt = window.__UTER_TOKEN_MANIFEST_META__ &&
          window.__UTER_TOKEN_MANIFEST_META__.generatedAt || null;
        resolve(window.__UTER_TOKEN_MANIFEST__);
      };
      s.onerror = function () { reject(new Error('无法读取离线快照 ' + SNAPSHOT_FILE)); };
      document.head.appendChild(s);
    });
  }

  function loadManifest() {
    return fetch(SPEC_FILE, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (md) { source = 'live'; return extractManifest(md); })
      .catch(function (liveErr) {
        source = 'snapshot';
        return loadSnapshot().catch(function (snapErr) {
          throw new Error('实时解析失败：' + liveErr.message + '；离线快照失败：' + snapErr.message +
            '。请在 docs/design-system/ 下执行 python3 -m http.server 后通过 HTTP 打开，' +
            '或先运行 node web/scripts/sync-design-showcase.mjs 生成快照。');
        });
      });
  }

  /* ── 2. 把 Manifest 注入 CSS 变量（页面外观也随规范变化）────────── */
  function setVar(name, value) { document.documentElement.style.setProperty(name, String(value)); }

  function applyTokens(m) {
    var all = m.typography.mainScale.concat(m.typography.companions);
    all.forEach(function (t) {
      setVar('--m-fs-' + t.class, t.size + 'px');
      setVar('--m-lh-' + t.class, t.line + 'px');
      setVar('--m-fw-' + t.class, t.weight);
    });
    m.radius.scale.forEach(function (r) { setVar('--m-r-' + r.token, r.value + 'px'); });
    m.spacing.scale.forEach(function (s) { setVar('--m-sp-' + s.token.replace(/\./g, '_'), s.value + 'px'); });
    m.motion.duration.forEach(function (d) { setVar(d.token, d.ms + 'ms'); });
    Object.keys(m.motion.easing).forEach(function (k) { setVar(k, m.motion.easing[k]); });

    setVar('--m-focus-ring', m.meta.focusRingWidth + 'px');
    setVar('--m-dur-fast', m.motion.duration[0].ms + 'ms');
    setVar('--m-ease', m.motion.easing['--ds-motion-ease']);
    setVar('--m-fs-body', m.meta.bodyBase + 'px');
    setVar('--m-fs-small', m.meta.minFontSize + 'px');
    setVar('--m-fs-h1', m.typography.hierarchy[0].size + 'px');
    setVar('--m-fs-h2', m.typography.hierarchy[1].size + 'px');
    setVar('--m-fs-h3', m.typography.hierarchy[2].size + 'px');
    setVar('--m-grad-from', m.colors.gradient.from);
    setVar('--m-grad-via', m.colors.gradient.via);
    setVar('--m-grad-to', m.colors.gradient.to);
  }

  function applyTheme(m, which) {
    theme = which;
    document.documentElement.setAttribute('data-theme', which);
    var t = m.colors.text[which], s = m.colors.surface[which],
        b = m.colors.brand[which], bd = m.colors.border[which];
    setVar('--m-bg', s.background); setVar('--m-card', s.card);
    setVar('--m-popover', s.popover); setVar('--m-muted', s.muted);
    setVar('--m-subtle', s.subtle || s.background);
    setVar('--m-border', bd.border);
    setVar('--m-fg', t.foreground); setVar('--m-fg-2', t.secondary);
    setVar('--m-fg-3', t.tertiary); setVar('--m-fg-disabled', t.disabled);
    setVar('--m-link', t.link);
    setVar('--m-brand', b.primary); setVar('--m-brand-fg', b.foreground);
    setVar('--m-brand-soft', b.soft); setVar('--m-brand-soft-fg', b.softForeground);
    var btn = document.getElementById('theme-toggle');
    if (btn) { btn.textContent = which === 'dark' ? '切换浅色' : '切换深色';
               btn.setAttribute('aria-pressed', which === 'dark' ? 'true' : 'false'); }
  }

  function applyDensity(m, mode) {
    density = mode;
    document.documentElement.setAttribute('data-density', mode);
    var key = mode.toLowerCase();
    function param(k, fallback) {
      var p = m.density.params.filter(function (x) { return x.key === k; })[0];
      return p ? p[key] : fallback;
    }
    setVar('--m-density-pad', param('cardPadding', 24) + 'px');
    setVar('--m-density-control', param('controlMd', 40) + 'px');
    Array.prototype.forEach.call(document.querySelectorAll('#density-controls .ctl'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.mode === mode ? 'true' : 'false');
    });
  }

  /* ── 3. 通用工具 ─────────────────────────────────────────────────── */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function copyBtn(value, label) {
    return '<button class="copy" type="button" data-copy="' + esc(value) + '" ' +
           'title="复制 ' + esc(label || value) + '" aria-label="复制 ' + esc(label || value) + '">复制</button>';
  }
  var _canvasCtx = null;
  function parseColor(css) {
    if (!css || typeof css !== 'string') return null;
    if (/color-mix|var\(/i.test(css)) return null;  // 派生值无法静态解析 → Pending
    if (!_canvasCtx) {
      var c = document.createElement('canvas'); c.width = c.height = 1;
      _canvasCtx = c.getContext('2d', { willReadFrequently: true });
    }
    _canvasCtx.fillStyle = '#000000';
    _canvasCtx.fillStyle = css;
    _canvasCtx.clearRect(0, 0, 1, 1);
    _canvasCtx.fillRect(0, 0, 1, 1);
    var d = _canvasCtx.getImageData(0, 0, 1, 1).data;
    return [d[0], d[1], d[2], d[3] / 255];
  }
  function luminance(rgb) {
    var a = rgb.slice(0, 3).map(function (v) {
      var x = v / 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
    });

      table([{ t: '组件' }, { t: '状态矩阵（§13.1）' }], [
        ['<b>Button / Input / Select / Badge / Card / Table / Toast / Empty</b>',
          '<span class="val">' + esc(M.components.interactionStates.join(' · ')) + '</span>']
      ]) + '</div>';
  };

  R.navigation = function () {
    var sel = M.components.navigation.selected[theme];
    return table([{ t: 'Token' }, { t: '高度', num: true }, { t: '预览' }],
      M.components.navigation.sizes.map(function (n) {
        return ['<code class="val">' + esc(n.token) + '</code>', n.height + 'px',
          '<div style="height:' + n.height + 'px;display:flex;align-items:center;padding:0 var(--m-sp-3);' +
          'border-radius:var(--m-r-md);background:var(--m-muted);font-size:var(--m-fs-small)">导航项</div>'];
      })) + '<h3 class="sub">选中态（当前主题）</h3>' +
      '<div class="row"><div style="padding:var(--m-sp-2) var(--m-sp-4);border-radius:var(--m-r-md);' +
      'background:' + esc(sel.background) + ';color:' + esc(sel.color) + '">当前选中项</div>' +
      verdict(contrast(sel.color, sel.background), M.a11y.contrast.normalText) + '</div>' +
      '<p class="lede">不得用 <code>--text-primary</code> 充当颜色 Token（§17.3）。</p>';
  };

  R.focus = function () {
    return '<div class="row"><button class="btn">Tab 聚焦看焦点环</button>' +
      '<input class="input" placeholder="输入框焦点">' +
      '<a href="#typography" style="color:var(--m-brand-soft-fg)">链接焦点</a></div>' +
      table([{ t: '项目' }, { t: '取值' }], [
        ['<b>焦点环宽度</b>', '<span class="val">' + M.a11y.focusRing.width + 'px</span>'],
        ['<b>offset</b>', '<span class="val">' + M.a11y.focusRing.offset + 'px（贴边、无 offset）</span>'],
        ['<b>样式</b>', '<span class="val">' + esc(M.a11y.focusRing.style) + '</span>'],
        ['<b>触控目标下限 / 推荐</b>', '<span class="val">' + M.a11y.touchTarget.minimum + 'px / ' +
          M.a11y.touchTarget.recommended + 'px</span>']
      ]) + '<h3 class="sub">对比度门槛</h3><p class="lede">普通文字 ' + M.a11y.contrast.normalText +
      ':1 · 大号文字 ' + M.a11y.contrast.largeText + ':1 · 必要 UI 组件边界 ' +
      M.a11y.contrast.uiComponent + ':1（WCAG 2.2 AA，§15.2）。</p>';
  };

  R['brand-gradient'] = function () {
    var g = M.colors.gradient;
    var lb = M.colors.surface.light.background, db = M.colors.surface.dark.background;
    var stops = [['from', g.from], ['via', g.via], ['to', g.to]];
    return '<div class="gradient-text">Uter.ai 优特智能，一个入口，直达全球大模型</div>' +
      '<h3 class="sub">三档停靠站（深浅同值）</h3><div class="swatches">' +
      stops.map(function (x) { return swatch(x[0], x[1]); }).join('') + '</div>' +
      '<h3 class="sub">实测对比度（背景取 §28 colors.surface）</h3>' +
      table([{ t: '停靠站' }, { t: '色值' }, { t: '浅色 ' + esc(lb) }, { t: '深色 ' + esc(db) }, { t: '判定' }],
        stops.map(function (x) {
          var l = contrast(x[1], lb), d = contrast(x[1], db);
          return ['<code class="val">' + x[0] + '</code>', '<span class="val">' + esc(x[1]) + '</span>',
            l === null ? 'Pending' : l.toFixed(2) + ':1', d === null ? 'Pending' : d.toFixed(2) + ':1',
            verdict(l, M.a11y.contrast.largeText)];
        })) + '<p class="lede">单一出口 <code>' + esc(g.owner) + '</code>；主题独立：' +
      (g.themeIndependent ? '是（禁止 :root.dark 覆盖）' : '否') +
      '。浅色 from / via 未达大文本 3:1，已登记 §26.2 B 类例外 E28，不进 ALLOWLIST。' +
      '背景色来自 §28，与 §2.5 / §17.5 同口径。</p>';
  };

  R.breakpoints = function () {
    return table([{ t: 'Breakpoint' }, { t: '宽度', num: true }, { t: '示意' }],
      Object.keys(M.breakpoints).map(function (k) {
        return ['<code class="val">' + esc(k) + '</code>', M.breakpoints[k] + 'px',
          '<div class="space-bar" style="width:' + (M.breakpoints[k] / 16) + 'px"></div>'];
      })) + '<h3 class="sub">内容区登记值（§16.2）</h3>' +
      table([{ t: '页面类型' }, { t: '上限', num: true }, { t: '依据' }], [
        ['后台内容区', M.meta.contentMax + 'px', '<span class="val">仪表盘 / 设置 / 日志</span>'],
        ['营销页宽屏', M.meta.contentMaxWide + 'px', '<span class="val">§28 meta.contentMaxWide（原 E19 编号已注销）</span>']
      ]) + '<p class="lede">指标数值断点用 md（' + M.breakpoints.md + 'px），不用 sm（' +
      M.breakpoints.sm + 'px）。</p>';
  };

  R['token-layers'] = function () {
    var vmeta = window.__UTER_TOKEN_MANIFEST_META__ || {};
    var verification = source === 'live'
      ? '实时解析；以 <code>sync-design-showcase.mjs --check</code> 输出为准'
      : esc(String(vmeta.verification ? vmeta.verification.summary : '快照未携带校验摘要'));
    return '<div class="chain">' +
      '<div class="node"><b>① 值 · 声明真源</b> — 本规范 §28 <code>TOKEN-MANIFEST</code>（唯一改值入口）</div>' +
      '<div class="node"><b>② 值 · 运行真源</b> — <code>web/src/design-system/tokens/</code> + <code>web/src/styles/theme.css</code></div>' +
      '<div class="node"><b>③ 规则与边界</b> — §1–§27；可执行清单 = §19.5 T1–T17 + §25</div>' +
      '<div class="node"><b>④ 纯消费者</b> — 本页 <code>showcase.html</code>（不保存任何 Token 副本）</div>' +
      '<div class="node"><b>⑤ 一致性校验</b> — <code>sync-design-showcase.mjs --check</code>（§28.3）</div>' +
      '</div><h3 class="sub">Token 分层（§17.2）</h3>' +
      table([{ t: '层' }, { t: '职责' }], [
        ['Primitive', '基础值：Slate 色阶、4px 网格、字重 400–700'],
        ['Semantic', '业务语义：background / foreground / primary / border'],
        ['Component', '组件专属：--ds-button-height-* / --ds-control-height-* / --radius-*']
      ]) + '<h3 class="sub">本次声明状态</h3>' +
      table([{ t: '字段' }, { t: '值' }], [
        ['version', '<code class="val">' + esc(M.version) + '</code>'],
        ['updated', '<code class="val">' + esc(M.updated) + '</code>'],
        ['spec', '<code class="val">' + esc(M.spec) + '</code>'],
        ['sections', '<span class="val">' + M.sections.length + ' 个区域（由数组自动生成导航）</span>'],
        ['$schema', '<code class="val">' + esc(M.$schema) + '</code>'],
        ['数据来源', '<span class="val">' + (source === 'live' ? '实时解析规范原文' : '离线快照 ' +
          esc(String(snapshotGeneratedAt || '未知时间'))) + '</span>'],
        ['校验状态', '<span class="val">' + verification + '</span>']
      ]) +
      '<h3 class="sub">语义间距（§6.2 / §28 spacing.semantic）</h3>' +
      table([{ t: '语义名' }, { t: '别名 / 状态' }],
        Object.keys(M.spacing.semantic.landed).map(function (n) {
          return ['<code class="val">' + esc(n) + '</code>',
            '<span class="val">→ <code>' + esc(M.spacing.semantic.landed[n]) + '</code>（已落地）</span>'];
        }).concat(M.spacing.semantic.pending.map(function (n) {
          return ['<code class="val">' + esc(n) + '</code>',
            '<span class="pending">Pending · 落地前用 §6.1 网格档</span>'];
        }))) +
      '<h3 class="sub">Pending 登记（§28.6 · 未纳入声明的值）</h3>' +
      table([{ t: '编号' }, { t: '范围' }, { t: '退出条件' }], M.pending.map(function (p) {
        return ['<code class="val">' + esc(p.id) + '</code>', esc(p.scope), esc(p.exitCondition)];
      })) +
      '<p class="lede">联动自检：修改 §28 里任一数值 → 刷新本页 → 对应区域的数值标签与' +
      '真实渲染同时变化；随后运行 <code>node web/scripts/sync-design-showcase.mjs --check</code> 同步运行真源。</p>';
  };

  /* ── 5. 装配 ─────────────────────────────────────────────────────── */
  function render() {
    applyTokens(M);
    applyTheme(M, theme);
    applyDensity(M, density);

    var nav = document.getElementById('nav');
    nav.innerHTML = '<h2>区域导航 · ' + M.sections.length + '</h2>' + M.sections.map(function (s) {
      return '<a href="#' + esc(s.id) + '"><span class="n">' + s.no + '</span>' + esc(s.title) +
        '</a>';
    }).join('');

    document.getElementById('sections').innerHTML = M.sections.map(function (s) {
      var fn = R[s.id];
      var body = fn ? fn() : '<p class="lede">该区域尚未提供渲染器（§28 sections 与展示页不同步）。</p>';
      return section(s, body);
    }).join('');

    document.getElementById('meta-grid').innerHTML = [
      '<span class="badge">v ' + esc(M.version) + '</span>',
      '<span class="badge">' + esc(M.updated) + '</span>',
      '<span class="badge">' + M.sections.length + ' 个区域</span>',
      '<span class="badge">' + (M.typography.mainScale.length + M.typography.companions.length) + ' 个字号档</span>',
      '<span class="badge">' + M.colors.chart.light.length + ' 个图表槽位</span>',
      '<span class="badge">' + M.radius.scale.length + ' 档圆角</span>'
    ].join('');

    var b = document.getElementById('source-badge');
    if (source === 'live') {
      b.className = 'badge live';
      b.innerHTML = '<span class="dot"></span>实时解析 §28 TOKEN-MANIFEST · 改值后刷新即生效';
    } else {
      b.className = 'badge snapshot';
      b.innerHTML = '<span class="dot"></span>离线快照' +
        (snapshotGeneratedAt ? ' · ' + esc(snapshotGeneratedAt) : '') +
        ' · 用本地 HTTP 服务打开可获得实时联动';
    }

    document.getElementById('theme-toggle').onclick = function () {
      applyTheme(M, theme === 'light' ? 'dark' : 'light'); render();
    };
    document.getElementById('density-controls').innerHTML = M.density.modes.map(function (m) {
      return '<button class="ctl" type="button" data-mode="' + esc(m) + '" aria-pressed="' +
        (m === density ? 'true' : 'false') + '">' + esc(m) + '</button>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#density-controls .ctl'), function (btn) {
      btn.onclick = function () { applyDensity(M, btn.dataset.mode); render(); };
    });

    document.getElementById('footer').innerHTML =
      'UTER Design System 3.0 · 数据驱动展示页 · 唯一值声明：§28 TOKEN-MANIFEST · ' +
      '规范 ' + esc(M.version) + ' (' + esc(M.updated) + ')';
  }

  /* 事件委托：复制 */
  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('.copy');
    if (!btn) return;
    var v = btn.dataset.copy;
    function done(ok) {
      var old = btn.textContent;
      btn.textContent = ok ? '已复制' : '失败';
      setTimeout(function () { btn.textContent = old; }, 1200);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(v).then(function () { done(true); }, function () { done(false); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = v; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      document.body.removeChild(ta); done(ok);
    }
  });

  loadManifest().then(function (m) {
    M = m;
    render();
  }).catch(function (err) {
    var box = document.getElementById('boot-error');
    box.hidden = false;
    box.innerHTML = '<strong>无法加载 Token Manifest</strong><br>' + esc(err.message);
    document.getElementById('source-badge').className = 'badge error';
    document.getElementById('source-badge').textContent = '加载失败';
  });
})();
</script>
</body>
</html>
