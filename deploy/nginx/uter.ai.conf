# Uter 生产环境 nginx 配置
#
# 三个独立站点：
#   1. uter.ai      —— 正式站，反代到 docker compose 里的 uter 容器（127.0.0.1:3000）
#   2. wx.uter.cc   —— 微信回调（公众号验证 + 开放平台网站应用授权回调域），主服务整站反代
#   3. api.uter.ai  —— API 专用入口（OpenAI 兼容 Base URL：https://api.uter.ai/v1），
#                      与主站同一 uter 容器（127.0.0.1:3000）；运营/文档对外只暴露此域名做 API
#
# 放置位置：/etc/nginx/conf.d/uter.ai.conf
# 证书：用 certbot 或阿里云免费证书，路径按实际改
#
# 部署后自检：
#   nginx -t && systemctl reload nginx
#   curl -I https://uter.ai/api/status
#   curl -s "https://wx.uter.cc/api/wechat?signature=x&timestamp=1&nonce=2&echostr=ok"
#     期望 403（签名不匹配）—— 能拿到 403 就说明请求已经打到 wechat-server 了
#   curl -s https://api.uter.ai/api/status | head -c 200
#     期望返回 JSON —— 说明 api 子域已反代到主服务

# ---------- 1. uter.ai 正式站 ----------

server {
    listen 80;
    listen [::]:80;
    server_name uter.ai;

    # 证书续期放行，其余强制跳 HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name uter.ai;

    ssl_certificate     /etc/nginx/ssl/uter.ai.pem;
    ssl_certificate_key /etc/nginx/ssl/uter.ai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头。注意：应用自身也会下发 CSP/HSTS，
    # 若出现重复头导致浏览器报错，把这里对应的行删掉，以应用为准。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # 文件上传 / 附件
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 这是 AI 网关，流式响应必须关闭缓冲，否则前端拿不到逐字输出
        proxy_buffering off;
        proxy_cache     off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}

# ---------- 2. wx.uter.cc 微信回调入口 ----------
#
# 微信只允许 80/443，且要求「响应体原样返回 echostr」，
# 所以这里必须是 proxy_pass 反代，不能写 return 301。

server {
    listen 80;
    listen [::]:80;
    server_name wx.uter.cc;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wx.uter.cc;

    ssl_certificate     /etc/nginx/ssl/wx.uter.cc.pem;
    ssl_certificate_key /etc/nginx/ssl/wx.uter.cc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 只暴露回调路径，wechat-server 的管理后台不对外
    location /api/wechat {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 微信验签是 GET，消息推送是 POST XML，都要原样透传
        proxy_request_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 微信开放平台「网站应用」的授权回调域 = wx.uter.cc（ICP 备案域 uter.cc 的
    # 子域；uter.ai 无法备案，不能作为授权回调域）。回调地址是
    # https://wx.uter.cc/oauth/wechat-web —— SPA 前端路由，浏览器需要从同一
    # 域名加载完整站点资源，回调页内换取会话的请求也是相对路径
    # /api/oauth/wechat-web，因此这里整站反代主服务（与 uter.ai 主站一致）。
    # wechat-server 只保留 /api/wechat 一个例外，其余行为与主站相同。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- 3. api.uter.ai API 专用入口 ----------
#
# 与主站同一 uter 容器，差别只在域名。证书先用 certbot 签发：
#   certbot certonly --webroot -w /var/www/certbot -d api.uter.ai \
#     --cert-name api.uter.ai
# 签发后把证书路径软链到 /etc/nginx/ssl/ 或改用 certbot 的 live 目录。

server {
    listen 80;
    listen [::]:80;
    server_name api.uter.ai;

    # 证书续期放行，其余强制跳 HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.uter.ai;

    ssl_certificate     /etc/nginx/ssl/api.uter.ai.pem;
    ssl_certificate_key /etc/nginx/ssl/api.uter.ai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # 大上下文对话请求体可能很大
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # AI 网关流式响应必须关闭缓冲，否则客户端拿不到逐字输出
        proxy_buffering off;
        proxy_cache     off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
