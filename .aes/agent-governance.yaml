version: "2.0.0"
policy_id: "UTER-AI-GOVERNANCE-P01"
status: "ACTIVE"
decision_mode: "AUTONOMOUS_MACHINE_ONLY"
default_effect: "DENY"
source_of_truth: ".aes/agent-governance.yaml"

# Baseline preservation and fail-closed delivery are mandatory
# (UTER-AES-GOV-001 §6.3 / §6.6 / §8.2 / §16.3). This section is consumed by
# test-ai-governance-policy.rb (L1-02) and the runtime policy evaluator
# (aes-agent-runtime-check.rb); both treat delivery actions (commit / push /
# PR) as DENIED until full validation has completed. Without this section the
# delivery gate silently degrades to allow, which the selftest negative cases
# catch as over-privilege.
execution_policy:
  governing_specification: "UTER-AES-GOV-001"
  baseline_preservation_required: true
  max_execution_branches_per_project: 1
  current_execution_branch: "main"
  environment_authorized_local_main_must_be_respected: true
  full_validation_required_before:
    # main-only policy (owner instruction 2026-11-11): the only delivery action
    # an agent may take is a LOCAL commit to main, and only after every
    # validation layer has passed. git.commit.local was added because that is
    # the action the runtime evaluator and the workspace_developer profile
    # actually authorise; the legacy git.commit entry is kept so older
    # task records remain covered. Feature-branch push and PR creation remain
    # gated but are additionally denied by the workspace_developer profile.
    - git.commit.local
    - git.commit
    - git.push.feature_branch
    - git.pull_request.create
  validation_layers:
    - L1_CHANGE_GATE
    - L2_INTEGRATION_GATE
    - L3_DOMAIN_ACCEPTANCE_GATE
    - L4_GLOBAL_CONFORMANCE_GATE
  independently_assessed_domains: 14
  runtime_agent_verification_required: true
  independent_assessment_required: true
  forbidden:
    - git.push.main
    - git.force_push
    - git.merge
    - git.pull_request.merge
    - git.worktree.create
    - git.reset.hard
    - git.clean
    - git.restore.user_files
    - deployment.execute
    - production.database.write
    - payment.configuration.write
    - overwrite.user_uncommitted_changes
    - falsify.verification_result

risk_levels:
  - R0
  - R1
  - R2
  - R3
  - R4

repository:
  default_branch: "main"
  execution_branch: "main"
  max_non_main_branches: 0
  local_main_execution: true
  commit_after_full_verification: true
  remote_push: false
  force_push: false
  pull_request_creation: false
  pull_request_merge: false
  deployment: false

global_controls:
  enforce_least_privilege: true
  require_task_identity: true
  require_tool_registration: true
  require_audit: true
  require_workspace_isolation: true
  production_credentials_available: false
  unrestricted_network: false
  agent_can_modify_own_policy: false
  delegated_permissions_can_escalate: false
  independent_machine_verification: true
  evidence_hashing: true
  append_only_evidence: true
  fail_closed: true
  unknown_is_pass: false
  not_run_is_pass: false

delivery_controls:
  full_validation_required_before:
    - git.commit.local
    - release_candidate
    - release
    - artifact_publication
  required_gate: "L4_GLOBAL_CONFORMANCE_GATE"
  gate_command: "node scripts/quality/l4-global-conformance-gate.mjs"
  gate_evidence: "L4 report must bind the same Uter HEAD and current AES governed fingerprint"
  gate_scope:
    - AES_PIN_AND_SEAL
    - AES_P00_P12_REQUIREMENTS
    - UTER_P13_BUSINESS_INVARIANTS
    - AGENT_RUNTIME_AND_PERMISSION_ENFORCEMENT
    - P09_QUALITY_ENGINEERING
    - P10_SECURITY_AND_RELIABILITY
    - BACKEND_FRONTEND_CROSS_PLATFORM_TESTS
    - INDEPENDENT_MACHINE_VERIFICATION
    - CURRENT_EVIDENCE_AND_DRIFT_CHECK
  incomplete_or_unknown_effect: "AUTO_BLOCK"
  NOT_RUN_is_PASS: false
  gate_verdict_source: "computed_from_current_machine_evidence_only"

task_lifecycle:
  states: [CREATED, EXECUTING, VERIFYING, CLOSED, BLOCKED, FAILED, INTERRUPTED]
  terminal_states: [CLOSED, FAILED]
  transitions:
    CREATED: [EXECUTING, BLOCKED]
    EXECUTING: [VERIFYING, BLOCKED, FAILED, INTERRUPTED]
    VERIFYING: [CLOSED, EXECUTING, BLOCKED, FAILED, INTERRUPTED]
    BLOCKED: [EXECUTING, FAILED]
    INTERRUPTED: [EXECUTING, BLOCKED]
    FAILED: []
    CLOSED: []
  close_requires:
    - all_acceptance_criteria_pass
    - required_tests_pass
    - evidence_complete
    - independent_machine_verification_pass
    - no_open_p0_issue
  resume_requires:
    - task_id
    - agent_id
    - last_completed_step
    - last_verified_commit
    - evidence_refs

agents:
  - id: "uter.agent.orchestration.main"
    role: "orchestrator"
    permission_profile: "orchestrator"
    definition_status: "defined"
    runtime_status: "NOT_VERIFIED"
  - id: "uter.agent.product.requirement"
    role: "product"
    permission_profile: "read_only"
    definition_status: "defined"
    runtime_status: "NOT_VERIFIED"
  - id: "uter.agent.research.technical"
    role: "research"
    permission_profile: "read_only"
    definition_status: "defined"
    runtime_status: "NOT_VERIFIED"
  - id: "uter.agent.architecture.review"
    role: "architecture"
    permission_profile: "machine_verifier"
    definition_status: "defined"
    runtime_status: "NOT_VERIFIED"
  - id: "uter.agent.design.system"
    role: "design"
    permission_profile: "workspace_developer"
    definition_status: "defined"
    runtime_status: "NOT_VERIFIED"
  - id: "uter.agent.engineering.coding"
    role: "coding"
    permission_profile: "workspace_developer"
    definition_status: "defined"
    runtime_status: "NOT_VERIFIED"
  - id: "uter.agent.quality.review"
    role: "machine_verifier"
    permission_profile: "machine_verifier"
    definition_status: "defined"
    runtime_status: "NOT_VERIFIED"
  - id: "uter.agent.quality.testing"
    role: "testing"
    permission_profile: "test_executor"
    definition_status: "defined"
    runtime_status: "NOT_VERIFIED"
  - id: "uter.agent.security.audit"
    role: "security"
    permission_profile: "security_auditor"
    definition_status: "defined"
    runtime_status: "NOT_VERIFIED"
  - id: "uter.agent.documentation"
    role: "documentation"
    permission_profile: "workspace_developer"
    definition_status: "defined"
    runtime_status: "NOT_VERIFIED"
  - id: "uter.agent.delivery"
    role: "delivery"
    permission_profile: "read_only"
    definition_status: "defined"
    runtime_status: "NOT_VERIFIED"

permission_profiles:
  orchestrator:
    allow: [task.create, task.delegate.scoped, task.status.read, report.read]
    deny: [filesystem.write, git.commit, git.push, git.merge, deployment.execute, production.database.write, payment.configuration.write]
  read_only:
    allow: [filesystem.read, repository.inspect, code.search, approved_web.search]
    deny: [filesystem.write, shell.execute, git.commit, git.push, git.merge, deployment.execute, production.database.write, payment.configuration.write]
  workspace_developer:
    allow: [filesystem.read, filesystem.write.scoped, shell.execute.scoped, test.execute, build.execute, git.diff, git.commit.local]
    deny: [git.push, git.force_push, git.branch.create, git.branch.switch, git.pull_request.create, git.merge, deployment.execute, production.database.write, payment.configuration.write, production.secrets.read, overwrite.user_uncommitted_changes]
  machine_verifier:
    allow: [filesystem.read, repository.inspect, code.search, test.execute, build.execute, security.scan, dependency.audit, report.write.scoped, evidence.verify]
    deny: [source.write, git.commit, git.push, git.merge, deployment.execute, production.database.write, payment.configuration.write]
  test_executor:
    allow: [filesystem.read, test.execute, build.execute, report.write.scoped, evidence.write.scoped]
    deny: [production.database.write, payment.configuration.write, git.merge, deployment.execute]
  security_auditor:
    allow: [filesystem.read, code.search, security.scan, dependency.audit, report.write.scoped, evidence.verify]
    deny: [production.database.write, payment.configuration.write, git.merge, deployment.execute]

action_policy:
  production_change: { effect: "AUTO_DENY", reason: "outside autonomous workspace scope" }
  real_payment_operation: { effect: "AUTO_DENY", reason: "real-funds operation is prohibited" }
  production_database_write: { effect: "AUTO_DENY", reason: "production data mutation is prohibited" }
  deployment: { effect: "AUTO_DENY", reason: "deployment is prohibited" }
  irreversible_data_operation: { effect: "AUTO_DENY", reason: "irreversible mutation is prohibited" }
  permission_escalation: { effect: "AUTO_DENY", reason: "delegated permissions cannot expand" }
  task_scope_expansion: { effect: "AUTO_BLOCK", reason: "create a new bounded task record" }
  ambiguous_requirement: { effect: "AUTO_BLOCK", reason: "derive candidate interpretations and require executable evidence; never guess" }
  verification_failure: { effect: "AUTO_BLOCK", reason: "preserve evidence, isolate change and run bounded remediation" }
  transient_failure: { effect: "BOUNDED_RETRY", max_attempts: 3, backoff: "exponential" }

# Machine-evaluable approval rules. `decide()` in
# scripts/quality/aes-agent-runtime-check.rb denies any action whose name
# matches one of these keys BEFORE any permission profile is consulted, so
# these denials hold even for a profile that would otherwise allow the action.
# This section was declared by the policy test suite but had never been present
# in the policy itself — the test crashed on fetch() instead of failing, which
# is why the gap went unnoticed.
approval_rules:
  production_change: { effect: "deny", reason: "production changes are prohibited in the autonomous workspace" }
  real_payment_change: { effect: "deny", reason: "real-funds payment operations are prohibited" }
  production_database_write: { effect: "deny", reason: "production data mutation is prohibited" }
  merge_pull_request: { effect: "deny", reason: "PR merges are not part of the main-only execution model" }
  deployment: { effect: "deny", reason: "deployment is prohibited" }

workspace_protection:
  preflight_required: true
  preserve_preexisting_tracked_changes: true
  preserve_untracked_files: true
  explicit_path_staging_only: true
  forbid_git_add_all: true
  forbid_git_clean: true
  forbid_git_reset_hard: true
  forbid_force_push: true
  overwrite_user_changes: false

multi_agent_coordination:
  task_id_unique: true
  task_claim_required: true
  delegated_authorization_must_not_expand: true
  result_handoff_required: true
  shared_resource_write_lock_required: true
  max_concurrent_writers_per_resource: 1
  conflicting_write_effect: "AUTO_BLOCK"
  duplicate_task_effect: "AUTO_DENY"

autonomous_resolution:
  enabled: true
  retry_transient_failures: true
  generate_machine_remediation_plan: true
  execute_safe_remediation: true
  require_independent_reverification: true
  unresolved_state: "BLOCKED"
  unresolved_state_is_terminal_success: false
  no_interactive_approval_queue: true

authorization_dimensions:
  required: [subject, task_id, action, resource, environment, scope, risk_level, expires_at]

audit_fields:
  required: [task_id, agent_id, tool_id, authorization_id, action, resource, environment, timestamp, result, evidence_ref]

# ---- Phase 2 runtime verification (2026-11-10, additive record from local main integration) ----
phase2_runtime_verification:
  performed_at: "2026-11-10T11:55:00Z"
  method: "tools/aes/agent-skills-runtime-verify.mjs — real disk reads: frontmatter parse (incl. folded scalars), canonical delegation resolution, referenced-file expansion and existence"
  evidence: ".aes/reports/UTER-AGENT-SKILLS-RUNTIME-VERIFICATION.json"
  canonical_skills: 4
  loaded_skills: 4
  verdict: "PASS"
  negative_tests: "tools/aes/agent-skills-runtime-verify.negative.test.mjs — 4/4 (broken frontmatter / missing delegation / missing referenced file / set divergence all fail closed)"
  note: "Definition-level runtime loading is machine verified. Autonomous behaviour of external agent runtimes remains external_unverified by design; agents[].runtime_status entries are intentionally unchanged by this record."
