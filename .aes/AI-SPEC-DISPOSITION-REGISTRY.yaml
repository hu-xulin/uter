build_order_and_untracked_enforcement_2026_11_08:
  defect_web_dist_shared_output: >-
    web/dist 是 web/（rsbuild）与 docs-web/（Next 导出 postbuild 拷贝）两个独立工程
    的共享输出目录。任一次 web 构建都会清空 dist，从而删掉 docs-content。
    catalogue 里 web-build → docs-web-build 的顺序只能维持到下一个触发 web 构建的
    目标为止，而 scripts/verify-all.sh 自己就内部跑 build:check。
    后果：//go:embed 因骨架文件仍能编译，但 main_docs_test.go 的两个用例断言真实
    文档导出，于是 go test / uter-quality.sh test / coverage-gate 全部失败。
  defect_untracked_enforcement_scripts: >-
    四个被真实流程引用、却从未纳入 Git 的执行脚本。这与 U-13 同类：
    声明了执行责任，执行体却只存在于本地。
  fix:
    verify_all: 在 build:check 之后补 docs-web build，并调用项目自带 verify-docs-artifacts.sh 作硬校验
    uter_quality: stage_test 补 embed 前置，并在文档站缺失时打印原因与修复命令，而非只抛裸 exit 1
    new_script: scripts/quality/ensure-embed-for-verification.sh（补骨架保编译 + 从 docs-web/out 秒级恢复真实导出）
  files_tracked_this_round:
