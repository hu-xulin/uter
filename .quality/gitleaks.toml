# UEQE gitleaks 配置：扩展默认规则 + 分类豁免。
# 豁免原则：只豁免「经人工核验为误报」的类别（2026-10-31 逐一目检），每条注明理由。
# 新增豁免必须在注释中写明核验日期与核验人。

[extend]
useDefault = true

# 2026-11-08 人工复核补充（核验人：WorkBuddy，逐行核对 6 条 generic-api-key 命中，均为误报）：
#   (a) ED25519 key SHA256:<43 chars> 是「公钥指纹」，出现在 UAES 规范签名验证结果中，
#       可追溯至 uaes/.uaes/spec-registry/SPECIFICATION-REGISTRY.yaml:151，不是私钥或凭据。
#       命中文件：.uaes/reports/uaes-integration-status.json:43、
#       reports/.../governance-refresh-verification.log:63、reports/.../re-audit.log:262。
#   (b) application/API security 是 D15 安全评估与报告生成器里的散文措辞，
#       被 generic-api-key 误当作 key=value 赋值。命中文件：D15-SECURITY-ASSESSMENT.md:22、
#       scripts/quality/uaes-governance-reports.py:491。
#   (c) OpenAPI commit: `<40hex>` 是 MA-06 历史证据文件内引用的 Git commit SHA（证据自引用），
#       命中文件：evidence/manual-acceptance/MA-06-finding.json:14。
# 采用「行级精确正则」而非「整文件放行」，并用 scripts/quality/gitleaks-allowlist.test.sh
# 做负向探针：同一个文件里注入真实形态密钥仍必须被检出。
[allowlist]
description = "误报豁免：文档示例 / 测试夹具 / 密钥处理代码 / 已核验误报文本（2026-10-31 全量核验 + 2026-11-08 6 条复核）"
regexTarget = "line"
regexes = [
  '''ED25519 key SHA256:[A-Za-z0-9+/=]{43}''',
  '''application/API security''',
  '''OpenAPI commit: `[0-9a-f]{40}`''',
]
paths = [
  # API 文档中的 curl 调用示例（占位 token，如 sk-xxxx / YOUR_API_KEY）
  '''^docs-web/content/''',
  # Go 与前端测试夹具（构造的假 token / 假 PEM）
  '''_test\.go$''',
  '''(^|/)__tests__/''',
  '''\.test\.(ts|tsx)$''',
  # 插件代码引用运行时 apiKey 变量，非硬编码密钥
  '''^web/public/plugins/''',
  '''^plugins/tasks/''',
  # 密钥格式处理代码：前缀剥离 / PEM 归一化 / 掩码与正则识别
  '''^middleware/auth\.go$''',
  '''^common/str\.go$''',
  '''^relaykit/relayconvert/kitutil/mask\.go$''',
  '''^service/waffo_key\.go$''',
  '''^relay/channel/vertex/service_account\.go$''',
  '''^setting/costopt/config\.go$''',
  # 视觉回归快照与前端构建产物（gitignore 目录的兜底排除）
  '''^\.visual-snapshots/''',
  '''^web/\.visual-e2e/''',
  '''^web/dist/''',
  '''(^|/)node_modules/''',
  # Issue 模板中的站点 URL 被 jwt/aws 规则误判
  '''^\.github/ISSUE_TEMPLATE/''',
]
